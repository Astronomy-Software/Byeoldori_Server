name: Deploy backend

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-backend-main
  cancel-in-progress: true

# VM(byeoldori.duckdns.org, arm64)은 docker-compose.oci.yml로 소스에서 직접 빌드한다.
# 소스 tarball을 scp로 전송 후 VM에서 build+up. GHCR pull(amd64) 방식 아님.
# 필요한 secrets: SSH_HOST, SSH_USER, SSH_KEY(전용 배포키), DEPLOY_DIR(예 /home/ubuntu/byeoldori-server)
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify Discord - Deploy Start
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_BACKEND_URL }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          [ -z "$DISCORD_URL" ] && exit 0
          SHORT="${SHA:0:7}"
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"🚀 별도리 서버 배포 시작\",\"color\":3447003,\"fields\":[{\"name\":\"커밋\",\"value\":\"[\`${SHORT}\`](${REPO_URL}/commit/${SHA})\",\"inline\":true},{\"name\":\"작업자\",\"value\":\"${ACTOR}\",\"inline\":true}]}]}" \
            "$DISCORD_URL" || true

      - name: Package source
        run: git archive --format=tar.gz -o byeoldori-src.tar.gz HEAD

      - name: Copy source to VM
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "byeoldori-src.tar.gz"
          target: "/tmp"

      - name: Build & restart on VM (arm64 native)
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd "${{ secrets.DEPLOY_DIR }}"
            tar -xzf /tmp/byeoldori-src.tar.gz -C "${{ secrets.DEPLOY_DIR }}"
            # 블루-그린 무중단 배포: 비활성 색을 빌드·기동→헬스 통과 시에만
            # nginx upstream 전환→구 색 정지. 실패하면 기존 컨테이너 유지.
            bash deploy-bluegreen.sh
            docker image prune -f || true

      - name: Notify Discord - Deploy Success
        if: success()
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_BACKEND_URL }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          [ -z "$DISCORD_URL" ] && exit 0
          SHORT="${SHA:0:7}"
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"✅ 별도리 서버 배포 완료\",\"color\":3066993,\"fields\":[{\"name\":\"커밋\",\"value\":\"[\`${SHORT}\`](${REPO_URL}/commit/${SHA})\",\"inline\":true},{\"name\":\"작업자\",\"value\":\"${ACTOR}\",\"inline\":true}]}]}" \
            "$DISCORD_URL" || true

      - name: Notify Discord - Deploy Failure
        if: failure()
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_BACKEND_URL }}
          SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$DISCORD_URL" ] && exit 0
          SHORT="${SHA:0:7}"
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ 별도리 서버 배포 실패\",\"color\":15158332,\"fields\":[{\"name\":\"커밋\",\"value\":\"[\`${SHORT}\`](${REPO_URL}/commit/${SHA})\",\"inline\":true},{\"name\":\"로그\",\"value\":\"[확인](${RUN_URL})\",\"inline\":true}]}]}" \
            "$DISCORD_URL" || true
