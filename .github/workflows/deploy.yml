name: Deploy backend

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch: {}

# 진행 중인 배포는 취소하지 않고 끝까지 돌린 뒤 다음 배포를 한다(대기열에는 가장 최근 것 하나만 남는다).
# 취소하면 ssh-action(PTY 없음)이 끊겨도 VM 쪽 스크립트는 계속 돌아 새 색이 nginx 밖에 남거나(@Scheduled 중복 실행)
# 다음 배포와 겹쳤다. 수동 취소에 대비해 VM 스크립트도 잠금(flock)으로 한 번에 하나만 돈다.
concurrency:
  group: deploy-backend-main
  cancel-in-progress: false

# VM(api.byeoldori.com, arm64)은 docker-compose.oci.yml로 소스에서 직접 빌드한다.
# 소스 tarball을 scp로 전송 후 VM에서 build+up. GHCR pull(amd64) 방식 아님.
# 필요한 secrets: SSH_HOST, SSH_USER, SSH_KEY(전용 배포키), DEPLOY_DIR(예 /home/ubuntu/byeoldori-server)
jobs:
  # 배포 전 테스트 게이트. ci.yml 은 pull_request 에서만 돌아, CI 가 빨간 PR 을 머지하거나 PR 여러 개가
  # 합쳐진 뒤 main 에서 깨져도 그대로 운영에 나갔다(Dockerfile 도 -x test 로 빌드). CI 와 같은 명령을 돌리고,
  # 실패하면 deploy 잡이 돌지 않아 VM 은 건드리지 않는다(서비스 중인 색 유지).
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Test
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Ops script tests
        run: |
          bash scripts/tests/backup_test.sh
          bash scripts/tests/backup_freshness_test.sh
          bash scripts/tests/bluegreen_test.sh
          bash scripts/tests/monitoring_reload_test.sh
          python3 scripts/tests/cf_exporter_test.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/
          retention-days: 7

      - name: Notify Discord - Test Failure
        if: failure()
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_BACKEND_URL }}
          SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$DISCORD_URL" ] && exit 0
          SHORT="${SHA:0:7}"
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ 별도리 서버 배포 중단 (테스트 실패, 기존 버전 유지)\",\"color\":15158332,\"fields\":[{\"name\":\"커밋\",\"value\":\"[\`${SHORT}\`](${REPO_URL}/commit/${SHA})\",\"inline\":true},{\"name\":\"로그\",\"value\":\"[확인](${RUN_URL})\",\"inline\":true}]}]}" \
            "$DISCORD_URL" || true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify Discord - Deploy Start
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_BACKEND_URL }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          [ -z "$DISCORD_URL" ] && exit 0
          SHORT="${SHA:0:7}"
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"🚀 별도리 서버 배포 시작\",\"color\":3447003,\"fields\":[{\"name\":\"커밋\",\"value\":\"[\`${SHORT}\`](${REPO_URL}/commit/${SHA})\",\"inline\":true},{\"name\":\"작업자\",\"value\":\"${ACTOR}\",\"inline\":true}]}]}" \
            "$DISCORD_URL" || true

      - name: Package source
        run: git archive --format=tar.gz -o byeoldori-src.tar.gz HEAD

      - name: Copy source to VM
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "byeoldori-src.tar.gz"
          target: "/tmp"

      - name: Build & restart on VM (arm64 native)
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # 빌드 + 헬스 게이트(최대 6분) + 예보 캐시 적재 대기(최대 5분)가 들어가도록 여유를 둔다
          command_timeout: 30m
          envs: DISCORD_WEBHOOK_BACKEND_URL,CLOUDFLARE_API_TOKEN,CLOUDFLARE_ACCOUNT_ID
          script: |
            set -e
            # 취소된 이전 배포의 VM 쪽 스크립트가 아직 돌고 있으면 끝날 때까지(최대 20분) 기다린다.
            # 압축 해제·빌드·nginx 전환이 겹치면 서비스 중인 색을 지울 수 있다.
            exec 9>/tmp/byeoldori-deploy.lock
            flock -w 1200 9 || { echo "이전 배포가 아직 실행 중(잠금 대기 20분 초과) — 중단"; exit 1; }
            cd "${{ secrets.DEPLOY_DIR }}"
            # 압축 해제는 덮어쓰기만 하고 레포에서 지운 파일은 남긴다. 예전 마이그레이션(V2~V6)이
            # src 에 남아 새 V2 와 버전이 겹쳐 기동 실패했다(2026-09-27). src 는 전부 레포에 있으므로 비우고 푼다.
            rm -rf src
            tar -xzf /tmp/byeoldori-src.tar.gz -C "${{ secrets.DEPLOY_DIR }}"
            # 모니터링용 시크릿을 VM에 전달 (Grafana 알림·CF exporter가 env_file로 읽음)
            umask 077
            printf 'DISCORD_WEBHOOK_URL=%s\nCF_API_TOKEN=%s\nCF_ACCOUNT_ID=%s\nCF_ACCOUNTS=%s\n' \
              "$DISCORD_WEBHOOK_BACKEND_URL" "$CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_ACCOUNT_ID" \
              > monitoring/secrets.env
            # 교육 프로그램 저장용 MongoDB 기동(앱이 연결하므로 배포 전에). 이미 떠있으면 no-op.
            docker compose -f docker-compose.oci.yml -f docker-compose.mongo.yml up -d mongo || true
            # 블루-그린 무중단 배포: 비활성 색을 빌드·기동→헬스 통과 시에만
            # nginx upstream 전환→구 색 정지. 실패하면 기존 컨테이너 유지.
            bash deploy-bluegreen.sh
            # 모니터링 스택 반영. up -d 는 마운트한 설정 파일(prometheus.yml·알림 룰·exporter 코드 등) 내용이 바뀌어도
            # 재생성하지 않으므로, 파일 sha256 이 달라진 서비스만 다시 만든다.
            # 아래 세 단계는 실패해도 배포(이미 전환된 새 버전)는 성공으로 두되, 예전처럼 삼키지 않고 Discord 로 경고한다.
            # (모니터링 반영 실패 → 알림 룰·exporter 가 옛 상태, 백업 cron 설치 실패 → 백업 0건인데 아무 알림 없음)
            DEPLOY_WARN=""
            bash scripts/reload-monitoring.sh || DEPLOY_WARN="${DEPLOY_WARN}모니터링 반영 실패(reload-monitoring.sh). "
            # 운영 데이터(MySQL·MongoDB·업로드) 일일 백업 cron 설치/갱신(멱등).
            bash scripts/install-backup-cron.sh || DEPLOY_WARN="${DEPLOY_WARN}백업 cron 설치 실패(install-backup-cron.sh). "
            # 백업 신선도(cron 항목·데몬, 26시간 안 완성 백업). backup.sh 의 실패 알림은 스크립트가 돌아야만 나간다.
            BACKUP_STATE=$(bash scripts/check-backup-freshness.sh 2>&1) || DEPLOY_WARN="${DEPLOY_WARN}백업 확인: ${BACKUP_STATE}. "
            echo "[backup-check] $BACKUP_STATE"
            docker image prune -f || true
            # VM 소스 빌드마다 캐시가 누적돼 24GB(디스크 89%)까지 찼던 것 방지.
            # 최근 사용분 3GB만 남겨 다음 빌드 속도는 유지한다.
            docker builder prune -f --max-used-space 3GB || true
            if [ -n "$DEPLOY_WARN" ]; then
              echo "배포 경고: $DEPLOY_WARN"
              # JSON 문자열에 넣으므로 따옴표·역슬래시는 빼고 줄바꿈은 공백으로 바꾼다.
              WARN_MSG=$(printf '%s' "$DEPLOY_WARN" | tr -d '"\\' | tr '\r\n\t' '   ')
              [ -n "$DISCORD_WEBHOOK_BACKEND_URL" ] && curl -s --max-time 10 -H "Content-Type: application/json" \
                -d "{\"embeds\":[{\"title\":\"⚠️ 별도리 서버 배포 경고 (새 버전은 배포됨)\",\"description\":\"${WARN_MSG}\",\"color\":15105570}]}" \
                "$DISCORD_WEBHOOK_BACKEND_URL" >/dev/null || true
            fi
        env:
          DISCORD_WEBHOOK_BACKEND_URL: ${{ secrets.DISCORD_WEBHOOK_BACKEND_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify Discord - Deploy Success
        if: success()
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_BACKEND_URL }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          [ -z "$DISCORD_URL" ] && exit 0
          SHORT="${SHA:0:7}"
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"✅ 별도리 서버 배포 완료\",\"color\":3066993,\"fields\":[{\"name\":\"커밋\",\"value\":\"[\`${SHORT}\`](${REPO_URL}/commit/${SHA})\",\"inline\":true},{\"name\":\"작업자\",\"value\":\"${ACTOR}\",\"inline\":true}]}]}" \
            "$DISCORD_URL" || true

      - name: Notify Discord - Deploy Failure
        if: failure()
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_BACKEND_URL }}
          SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$DISCORD_URL" ] && exit 0
          SHORT="${SHA:0:7}"
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ 별도리 서버 배포 실패\",\"color\":15158332,\"fields\":[{\"name\":\"커밋\",\"value\":\"[\`${SHORT}\`](${REPO_URL}/commit/${SHA})\",\"inline\":true},{\"name\":\"로그\",\"value\":\"[확인](${RUN_URL})\",\"inline\":true}]}]}" \
            "$DISCORD_URL" || true
