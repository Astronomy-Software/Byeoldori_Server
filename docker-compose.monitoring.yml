# 모니터링 스택 (Prometheus + Grafana + Loki + Alloy)
# 저리소스 구성: 합계 상한 ~1GB, 보존 30일. 앱과 같은 backend 네트워크에서
# app-blue/app-green의 /actuator/prometheus를 직접 스크레이프한다.
# 기동: docker compose -f docker-compose.oci.yml -f docker-compose.monitoring.yml up -d prometheus grafana loki alloy
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    mem_limit: 400m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [backend]

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: always
    mem_limit: 200m
    env_file:
      - ./monitoring/secrets.env # 배포 시 Actions가 생성 (Discord 웹훅 등)
    environment:
      GF_SERVER_ROOT_URL: https://grafana.byeoldori.com
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000" # nginx 리버스프록시 전용(외부 미개방)
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [backend]

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    mem_limit: 300m
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks: [backend]

  # 자작 경량 exporter (stdlib만, 의존성 0). lablabs/cloudflare-exporter 0.2.3은
  # '고정 1분 창'만 조회해 무료플랜 저트래픽 worker 메트릭이 항상 0이 되는 구조적
  # 결함이 있어 교체. 이 exporter는 연속(비겹침) 창을 누적해 정확한 counter를 만든다.
  # 상세: monitoring/cf-worker-exporter.py 상단 주석.
  cloudflare-exporter:
    image: python:3.12-alpine
    container_name: cloudflare-exporter
    restart: always
    mem_limit: 96m
    env_file:
      - ./monitoring/secrets.env # CF_API_TOKEN, CF_ACCOUNT_ID(또는 CF_ACCOUNTS) 사용
    environment:
      REFRESH_SECONDS: "60"
      SETTLE_SECONDS: "180" # 애널리틱스 수집 지연 보정
      BACKFILL_MINUTES: "60" # 기동 시 과거 60분 1회 백필 → 즉시 데이터 표시
    volumes:
      - ./monitoring/cf-worker-exporter.py:/app/exporter.py:ro
    command: ["python", "/app/exporter.py"]
    networks: [backend]

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: always
    mem_limit: 150m
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [backend]

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
