<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>이메일 인증 실패</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 52px 48px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            color: #fff;
        }
        .icon {
            font-size: 56px;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }
        p {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            line-height: 1.6;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">⚠️</div>
    <h2>이메일 인증에 실패했습니다</h2>
    <p th:text="${message}">유효하지 않은 인증 링크입니다.</p>
    <p>이미 인증을 마쳤다면 앱에서 바로 로그인할 수 있습니다.</p>
    <p>링크가 만료됐다면 같은 이메일로 다시 가입하면 새 인증 메일을 받을 수 있습니다.</p>
</div>
</body>
</html>
