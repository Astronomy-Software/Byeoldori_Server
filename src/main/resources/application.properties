server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.docker.compose.enabled=false
spring.jackson.time-zone=Asia/Seoul

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/byeoldori}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.open-in-view=false


# 교육 프로그램(인터랙티브 씬 JSON) 저장소 — MongoDB (교육 게시글은 MySQL 그대로)
spring.data.mongodb.uri=${MONGO_URI:mongodb://root:root@localhost:27017/byeoldori?authSource=admin}
spring.data.mongodb.auto-index-creation=true

spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# mail(SMTP) 인증 실패가 전체 health 를 DOWN 으로 만들어 블루그린 헬스게이트를 막는다.
# 메일은 서비스 가용성과 무관하므로 health 기여에서 제외(메일 자격증명 문제는 별개로 처리).
management.health.mail.enabled=false
# 배포 워밍업 게이트: 예보 메모리 캐시 적재 전에는 weatherApi 가 WARMING 을 내고 이 그룹이 503 이 된다.
# deploy-bluegreen.sh 가 /actuator/health/warm 을 시간 상한을 두고 기다린 뒤 nginx 를 전환한다.
management.endpoint.health.group.warm.include=weatherApi
management.endpoint.health.group.warm.status.order=DOWN,OUT_OF_SERVICE,WARMING,UP,UNKNOWN
management.endpoint.health.group.warm.status.http-mapping.WARMING=503

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false

weather.api.key=${WEATHER_API_KEY}
weather.api.url=${WEATHER_API_URL}

# 기상청 API 응답 지연 대응 - 5분 타임아웃
spring.mvc.async.request-timeout=300000

forecast.retry.delay=60
forecast.retry.attempts=5

# JWT setting (access 1hour, refresh 14day)
jwt.secret=${JWT_SECRET}
jwt.access.expiration=3600000
jwt.refresh.expiration=1209600000

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.host-url=${APP_HOST_URL:http://localhost:8080}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}

# Google OAuth2
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}

# Kakao OAuth2
kakao.client-id=${KAKAO_CLIENT_ID}
kakao.client-secret=${KAKAO_CLIENT_SECRET}

# Naver OAuth2
naver.client-id=${NAVER_CLIENT_ID}
naver.client-secret=${NAVER_CLIENT_SECRET}

# 이미지/파일 업로드 (AttachmentPolicy 와 동일하게 20MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB
storage.type=${STORAGE_TYPE:local}
# Upload save path
storage.local.base-dir=${STORAGE_LOCAL_BASE_DIR:uploads}
# URL prefix (server host). 코드가 경로에 /files 를 명시적으로 붙이므로 bare 도메인으로 둔다.
storage.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
# GCS settings
storage.gcs.bucket=${GCS_BUCKET_NAME:byeoldori-uploads}
storage.allowed-content-types=image/jpeg,image/png,image/webp,image/gif,application/json
storage.max-megapixels=50
# 사용자별 업로드 쿼터(/files/image, /files/upload). 초과 시 429. 한 명이 VM 디스크를 채우지 못하게 한다
storage.upload.max-files-per-hour=120
storage.upload.max-bytes-per-day=524288000

#community home UI Post count
community.home.item-count=20

# Calendar settings
calendar.max-photos-per-event=10
calendar.max-image-bytes=10485760
