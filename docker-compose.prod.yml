services:
  app:
    image: ghcr.io/astronomy-software/byeoldori-server:latest
    container_name: app
    restart: always
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul

      SPRING_PROFILES_ACTIVE: prod

      STORAGE_TYPE: local
      STORAGE_LOCAL_BASE_DIR: /data/uploads
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}

      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/byeoldori?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"

      SERVER_PORT: "8080"
      SERVER_ADDRESS: "0.0.0.0"

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      # temurin:21-jre-jammy 이미지에는 curl/wget 이 없어 bash /dev/tcp 로 actuator health 확인
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q 'UP' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

    volumes:
      - uploads:/data/uploads
      - ./.env:/app/.env:ro
    networks:
      backend:
        aliases:
          - app

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password --lower_case_table_names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: byeoldori
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: always
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks: [backend]

networks:
  backend: {}

volumes:
  mysql_data: {}
  redis_data: {}
  uploads: {}
