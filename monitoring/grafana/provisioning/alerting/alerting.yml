apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord
    receivers:
      - uid: discord-main
        type: discord
        settings:
          url: $DISCORD_WEBHOOK_URL

policies:
  - orgId: 1
    receiver: discord
    group_by: ["alertname"]

groups:
  - orgId: 1
    name: byeoldori
    folder: Byeoldori
    interval: 1m
    rules:
      # 활성/비활성 색 모두 다운 = 실제 장애 (한쪽 down은 정상 상태)
      - uid: backend-down
        title: "백엔드 다운 (모든 색 down)"
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: max(up{job="byeoldori-app"})
              refId: A
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
      # 5xx 비율 5% 초과 5분 지속
      - uid: high-error-rate
        title: "HTTP 5xx 에러율 5% 초과"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m]))
              refId: A
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
      # 디스크 사용률 85% 초과 10분 지속. MySQL·Loki·Prometheus·빌드 캐시가 같은 부트볼륨을 쓰고,
      # 89%(24GB)까지 찼던 적이 있다. 앱의 DiskSpaceMetrics(컨테이너 overlay = 호스트 docker 루트 FS)를
      # 대시보드 패널과 같은 식으로 본다. 앱이 모두 다운이면 데이터가 없으므로 OK(백엔드 다운 룰이 담당).
      - uid: disk-high
        title: "디스크 사용률 85% 초과"
        condition: C
        for: 10m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: max((disk_total_bytes{job="byeoldori-app"} - disk_free_bytes{job="byeoldori-app"}) / clamp_min(disk_total_bytes{job="byeoldori-app"}, 1))
              refId: A
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.85] }
      # Cloudflare 엣지 응답 5xx 비율 5% 초과 5분 지속. 위 룰은 모두 앱(byeoldori-app) 메트릭이라
      # 웹(byeoldori.com, Workers) SSR 500·프록시 502 같은 장애를 못 본다. cf-worker-exporter 의
      # zone 누적 counter 를 쓴다(애널리틱스 지연 때문에 약 3분 늦게 반영). 트래픽이 적을 때 한두 건으로
      # 울리지 않게 10분간 요청이 20건 이상일 때만 판정한다. exporter 가 죽거나 트래픽이 없으면 OK.
      # exporter 는 Cloudflare 계정의 존을 모두 수집하므로(byeoltokki.com 등) 세 셀렉터 모두 byeoldori.com 존으로 한정한다.
      # 한정하지 않으면 다른 사이트의 5xx 로 울리거나, 다른 사이트 트래픽이 분모를 키워 별도리 장애를 놓친다.
      - uid: cf-edge-5xx
        title: "Cloudflare 엣지 5xx 비율 5% 초과 (웹·API)"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: (sum(rate(cloudflare_zone_requests_status{zone="byeoldori.com",status=~"5.."}[10m])) or on() vector(0)) / sum(rate(cloudflare_zone_requests_status{zone="byeoldori.com"}[10m])) and on() sum(increase(cloudflare_zone_requests_status{zone="byeoldori.com"}[10m])) >= 20
              refId: A
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
